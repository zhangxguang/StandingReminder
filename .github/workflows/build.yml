name: Build and release StandingReminder

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  SPARKLE_VERSION: 2.9.5
  SPARKLE_ARCHIVE_SHA256: 015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc
  STANDING_REMINDER_TEAM_ID: 2NW8BV74J4
  STANDING_REMINDER_DEVELOPER_ID_SHA1: 21F5693C7C25FA8759E14E1C2751628E0BD38428
  STANDING_REMINDER_DEVELOPER_ID_NAME: "Developer ID Application: xiangguang zhang (2NW8BV74J4)"

jobs:
  verify:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project StandingReminder.xcodeproj \
            -scheme StandingReminder

      - name: Run tests
        run: |
          xcodebuild test \
            -project StandingReminder.xcodeproj \
            -scheme StandingReminder \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=

      - name: Build unsigned Release configuration
        run: |
          xcodebuild build \
            -project StandingReminder.xcodeproj \
            -scheme StandingReminder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData-Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=

  release:
    name: Sign, notarize and publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify version and release secrets
        shell: bash
        run: |
          set -euo pipefail

          required_secrets=(
            MAC_CERTIFICATE_P12
            MAC_CERTIFICATE_PASSWORD
            APPLE_API_KEY_P8
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_TEAM_ID
            SPARKLE_EDDSA_PRIVATE_KEY
          )
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Required GitHub Actions secret is missing: ${secret_name}" >&2
              exit 1
            fi
          done

          if [[ "${APPLE_TEAM_ID}" != "${STANDING_REMINDER_TEAM_ID}" ]]; then
            echo "APPLE_TEAM_ID does not match the configured Developer ID certificate." >&2
            exit 1
          fi

          build_settings="${RUNNER_TEMP}/standing-reminder-build-settings.txt"
          xcodebuild -showBuildSettings \
            -project StandingReminder.xcodeproj \
            -scheme StandingReminder \
            -configuration Release > "${build_settings}"
          version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION = //p' "${build_settings}" | head -1)"
          build_number="$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION = //p' "${build_settings}" | head -1)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${version}." >&2
            exit 1
          fi
          if ! [[ "${build_number}" =~ ^[0-9]+$ ]]; then
            echo "CURRENT_PROJECT_VERSION must be an integer." >&2
            exit 1
          fi
          {
            echo "APP_VERSION=${version}"
            echo "APP_BUILD=${build_number}"
          } >> "${GITHUB_ENV}"

      - name: Configure Developer ID signing
        shell: bash
        run: |
          set -euo pipefail

          signing_dir="${RUNNER_TEMP}/standing-reminder-signing"
          keychain_path="${RUNNER_TEMP}/standing-reminder-signing.keychain-db"
          certificate_path="${signing_dir}/developer-id.p12"
          api_key_path="${signing_dir}/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_password="$(openssl rand -base64 32)"

          mkdir -p "${signing_dir}"
          chmod 700 "${signing_dir}"
          printf '%s' "${MAC_CERTIFICATE_P12}" | openssl base64 -d -A > "${certificate_path}"
          printf '%s' "${APPLE_API_KEY_P8}" | openssl base64 -d -A > "${api_key_path}"
          chmod 600 "${certificate_path}" "${api_key_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MAC_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s \
            "${keychain_path}" \
            "${HOME}/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "${keychain_path}"

          identity_output="$(security find-identity -v -p codesigning "${keychain_path}")"
          printf '%s\n' "${identity_output}"
          expected_identity="${STANDING_REMINDER_DEVELOPER_ID_SHA1} \"${STANDING_REMINDER_DEVELOPER_ID_NAME}\""
          if ! grep -Fq "${expected_identity}" <<< "${identity_output}"; then
            echo "The imported certificate is not the expected Developer ID identity." >&2
            exit 1
          fi

          {
            echo "SIGNING_DIR=${signing_dir}"
            echo "SIGNING_KEYCHAIN=${keychain_path}"
            echo "APPLE_API_KEY_PATH=${api_key_path}"
          } >> "${GITHUB_ENV}"

      - name: Archive and export application
        shell: bash
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/StandingReminder.xcarchive"
          export_path="${RUNNER_TEMP}/StandingReminder-export"

          xcodebuild archive \
            -project StandingReminder.xcodeproj \
            -scheme StandingReminder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "${archive_path}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${STANDING_REMINDER_DEVELOPER_ID_NAME}"

          xcodebuild -exportArchive \
            -archivePath "${archive_path}" \
            -exportPath "${export_path}" \
            -exportOptionsPlist scripts/ExportOptions.plist

          app_path="${export_path}/StandingReminder.app"
          test -d "${app_path}"
          echo "APP_PATH=${app_path}" >> "${GITHUB_ENV}"

      - name: Notarize and staple application
        shell: bash
        run: |
          set -euo pipefail
          notarization_zip="${RUNNER_TEMP}/StandingReminder-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${notarization_zip}"
          xcrun notarytool submit "${notarization_zip}" \
            --key "${APPLE_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait
          xcrun stapler staple "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"

      - name: Build update ZIP and DMG
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${GITHUB_WORKSPACE}/release"
          update_dir="${RUNNER_TEMP}/standing-reminder-update"
          dmg_root="${RUNNER_TEMP}/standing-reminder-dmg"
          mkdir -p "${release_dir}" "${update_dir}" "${dmg_root}"

          zip_name="StandingReminder-${APP_VERSION}-mac-universal.zip"
          dmg_name="StandingReminder-${APP_VERSION}-mac-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "${APP_PATH}" "${update_dir}/${zip_name}"

          ditto "${APP_PATH}" "${dmg_root}/StandingReminder.app"
          ln -s /Applications "${dmg_root}/Applications"
          hdiutil create \
            -volname "StandingReminder ${APP_VERSION}" \
            -srcfolder "${dmg_root}" \
            -ov \
            -format UDZO \
            "${release_dir}/${dmg_name}"
          codesign \
            --force \
            --sign "${STANDING_REMINDER_DEVELOPER_ID_SHA1}" \
            --timestamp \
            --keychain "${SIGNING_KEYCHAIN}" \
            "${release_dir}/${dmg_name}"
          xcrun notarytool submit "${release_dir}/${dmg_name}" \
            --key "${APPLE_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait
          xcrun stapler staple "${release_dir}/${dmg_name}"
          xcrun stapler validate "${release_dir}/${dmg_name}"

          cp "${update_dir}/${zip_name}" "${release_dir}/${zip_name}"
          {
            echo "RELEASE_DIR=${release_dir}"
            echo "UPDATE_DIR=${update_dir}"
            echo "UPDATE_ZIP=${release_dir}/${zip_name}"
            echo "RELEASE_DMG=${release_dir}/${dmg_name}"
          } >> "${GITHUB_ENV}"

      - name: Generate signed Sparkle appcast
        shell: bash
        run: |
          set -euo pipefail
          sparkle_dir="${RUNNER_TEMP}/Sparkle-${SPARKLE_VERSION}"
          sparkle_archive="${RUNNER_TEMP}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          curl -fL --retry 3 \
            -o "${sparkle_archive}" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_ARCHIVE_SHA256}  ${sparkle_archive}" | shasum -a 256 -c -
          mkdir -p "${sparkle_dir}"
          tar -xJf "${sparkle_archive}" -C "${sparkle_dir}"

          printf '%s' "${SPARKLE_EDDSA_PRIVATE_KEY}" | \
            "${sparkle_dir}/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/zhangxguang/StandingReminder/releases/download/${GITHUB_REF_NAME}/" \
              --link "https://github.com/zhangxguang/StandingReminder" \
              --maximum-versions 3 \
              "${UPDATE_DIR}"
          cp "${UPDATE_DIR}/appcast.xml" "${RELEASE_DIR}/appcast.xml"

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          codesign --verify --strict --verbose=2 "${RELEASE_DMG}"
          xcrun stapler validate "${APP_PATH}"
          xcrun stapler validate "${RELEASE_DMG}"
          spctl -a -t exec -vv "${APP_PATH}"
          spctl -a -t open --context context:primary-signature -vv "${RELEASE_DMG}"
          lipo "${APP_PATH}/Contents/MacOS/StandingReminder" -verify_arch arm64 x86_64
          plutil -extract SUFeedURL raw "${APP_PATH}/Contents/Info.plist" | \
            grep -Fq 'StandingReminder/releases/latest/download/appcast.xml'
          plutil -extract SUPublicEDKey raw "${APP_PATH}/Contents/Info.plist" | \
            grep -Fq '0mXDhY+JGMThFqmvkupbdeqyF3su5nsRZ5i9NUCh+7o='
          test -s "${RELEASE_DIR}/appcast.xml"
          shasum -a 256 "${UPDATE_ZIP}" "${RELEASE_DMG}" > "${RELEASE_DIR}/SHA256SUMS.txt"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_files=(
            "${RELEASE_DIR}"/*.dmg
            "${RELEASE_DIR}"/*.zip
            "${RELEASE_DIR}/appcast.xml"
            "${RELEASE_DIR}/SHA256SUMS.txt"
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${release_files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${release_files[@]}" \
              --title "StandingReminder ${APP_VERSION}" \
              --generate-notes
          fi

      - name: Remove temporary signing assets
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "${SIGNING_KEYCHAIN}" ]]; then
            security default-keychain -d user -s "${HOME}/Library/Keychains/login.keychain-db" || true
            security delete-keychain "${SIGNING_KEYCHAIN}" || true
          fi
          if [[ -n "${SIGNING_DIR:-}" && -d "${SIGNING_DIR}" ]]; then
            find "${SIGNING_DIR}" -type f -delete
            rmdir "${SIGNING_DIR}" || true
          fi
